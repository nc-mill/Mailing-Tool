name: mlain

# Rozdělený režim: každý proces vlastní kontejner. Health porty tady kolidovat
# nemůžou, ale výchozí hodnoty zůstávají různé, aby se MODE=all a rozdělený
# režim chovaly stejně.
#
# Použití: docker compose -f compose.yml -f compose.scale.yml up -d

services:
  app:
    environment:
      MODE: web
      MIGRATE_ON_START: "true"

  worker:
    image: ghcr.io/nc-mill/mlain:1.0.0
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    environment:
      MODE: worker
      MIGRATE_ON_START: "false"
      APP_URL: ${APP_URL:?APP_URL je povinná}
      DATABASE_URL: ${DATABASE_URL:-postgres://mlain_app:mlain@postgres:5432/mlain}
      # ČTYŘI PŘIPOJENÍ, NE JEDNO. Worker je jediný proces, který pouští úlohy
      # na pozadí, takže potřebuje VŠECHNY vyhrazené role. Do 7. 8. 2026 tu byl
      # jenom `DATABASE_URL` a rozdělený režim tím tiše přicházel o tři věci
      # naráz; v MODE=all se to neprojevilo, protože tam všechno běží
      # v kontejneru `app`, který proměnné má.
      #
      # mlain_migrator: noční záloha (`platform.backup`, pod aplikační rolí by
      # `pg_dump` narazil na row level security) a údržba oddílů
      # (`platform.maintain_partitions`, odpojení oddílu je DDL). Bez ní obě
      # úlohy každou noc skončí chybou a instalace nemá ani zálohu, ani retenci
      # odeslané pošty.
      DATABASE_URL_MIGRATOR: ${DATABASE_URL_MIGRATOR:-postgres://mlain_migrator:${POSTGRES_PASSWORD:-mlain}@postgres:5432/mlain}
      # mlain_maintenance: úlohy, které čtou napříč projekty. Bez ní se
      # NAPLÁNOVANÁ KAMPAŇ NEODEŠLE a smazané projekty se neuklidí.
      DATABASE_URL_MAINTENANCE: ${DATABASE_URL_MAINTENANCE:-postgres://mlain_maintenance:mlain@postgres:5432/mlain}
      # mlain_gdpr: výmaz osobních údajů podle článku 17. Souhlasy smí smazat
      # jedině tahle role; bez ní se `gdpr.erase` v režimu anonymize ZRUŠÍ CELÝ
      # a žádost subjektu zůstane nevyřízená, přestože jí běží zákonná lhůta.
      DATABASE_URL_GDPR: ${DATABASE_URL_GDPR:-postgres://mlain_gdpr:mlain@postgres:5432/mlain}
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY je povinná}
      DEFAULT_LOCALE: ${DEFAULT_LOCALE:-cs}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      WORKER_HEALTH_PORT: 3001
    volumes:
      - ./data:/data
    stop_grace_period: 40s
    read_only: true
    tmpfs:
      - /tmp:size=256m
    security_opt:
      - no-new-privileges:true

  sender:
    image: ghcr.io/nc-mill/mlain:1.0.0
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    environment:
      MODE: sender
      MIGRATE_ON_START: "false"
      APP_URL: ${APP_URL:?APP_URL je povinná}
      DATABASE_URL_SENDER: ${DATABASE_URL_SENDER:-postgres://mlain_sender:mlain@postgres:5432/mlain}
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY je povinná}
      SENDER_HEALTH_PORT: 3002
      # Statické dělení kvóty provideru mezi repliky, viz část 4b, 3.11.2.
      SENDER_REPLICAS: ${SENDER_REPLICAS:-1}
    stop_grace_period: 40s
    read_only: true
    tmpfs:
      - /tmp:size=256m
    security_opt:
      - no-new-privileges:true
