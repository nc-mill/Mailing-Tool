name: mlain

services:
  app:
    image: ghcr.io/nc-mill/mlain:1.0.0 # nikdy :latest v produkci
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
        required: false # při externím Postgresu se profil "bundled" nepustí
    environment:
      MODE: all
      APP_URL: ${APP_URL:?APP_URL je povinná}
      DATABASE_URL: ${DATABASE_URL:-postgres://mlain_app:mlain@postgres:5432/mlain}
      # Migrace běží pod migrátorem, ne pod aplikační rolí. Bez téhle proměnné
      # nemá runner z 3.13 čím se připojit.
      DATABASE_URL_MIGRATOR: ${DATABASE_URL_MIGRATOR:-postgres://mlain_migrator:${POSTGRES_PASSWORD:-mlain}@postgres:5432/mlain}
      DATABASE_URL_SENDER: ${DATABASE_URL_SENDER:-postgres://mlain_sender:mlain@postgres:5432/mlain}
      # Systémové úlohy, které čtou napříč projekty (plánovač kampaní, hlídač
      # běžících, obnova po kvótě, rekonciliace outboxu, rekontrola domén)
      # a úklid projektů po uplynutí lhůty na obnovu. Role mlain_maintenance má
      # výjimku z izolace jen na workspaces, campaigns a sender_domains, viz
      # migrace 0009.
      #
      # Výchozí hodnota je tu proto, že u zabaleného Postgresu roli zakládá
      # docker/initdb se stejným heslem jako ostatní. U externího Postgresu
      # proměnnou vyplňte v .env; když ji necháte prázdnou, aplikace naběhne
      # a jen tyhle úlohy odmítnou běžet s vysvětlením. NAPLÁNOVANÁ kampaň se
      # pak neodešle.
      DATABASE_URL_MAINTENANCE: ${DATABASE_URL_MAINTENANCE:-postgres://mlain_maintenance:mlain@postgres:5432/mlain}
      # Výmaz osobních údajů podle článku 17. Souhlasy jsou append only a smazat
      # je smí jedině role mlain_gdpr; aplikační role to právo nemá ani mít
      # nesmí. Role výjimku z izolace projektů NEMÁ, maže v kontextu jednoho
      # projektu jako každá jiná operace nad osobními údaji.
      #
      # Výchozí hodnota platí pro zabalený Postgres, kde roli zakládá
      # docker/initdb se stejným heslem jako ostatní. U externího Postgresu
      # proměnnou vyplňte v .env; když ji necháte prázdnou, aplikace naběhne,
      # ale ŽÁDOST O VÝMAZ SE NEVYŘÍDÍ a úloha gdpr.erase skončí v chybě.
      DATABASE_URL_GDPR: ${DATABASE_URL_GDPR:-postgres://mlain_gdpr:mlain@postgres:5432/mlain}
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY je povinná, vygenerujte ji příkazem mlain genkey}
      # Doména pro odkazy /t/o/, /t/c/ a /u/, které staví SENDER.
      #
      # Konfigurace v Node si ji umí odvodit z APP_URL, jenže sender je binárka
      # v Go a APP_URL nedostává (nález K7 plánu P09). Bez téhle proměnné se
      # tedy sender ve výchozí instalaci vůbec nespustí:
      #
      #   konfigurace je neplatná:
      #     - TRACKING_DOMAIN: chybí. Sender z ní staví odkazy /t/o/, /t/c/ a /u/.
      #
      # Kontejner pak skončí v restartové smyčce, přestože web i worker běží.
      #
      # Když se nenastaví, odvodí ji `docker/entrypoint.sh` z APP_URL. Compose
      # to udělat nemůže: umí jen `${VAR:-výchozí}`, ne úpravu řetězce, takže
      # `${TRACKING_DOMAIN:-${APP_URL#*://}}` skončí na
      # „invalid interpolation format". Odvození proto patří do entrypointu,
      # kde je skutečný shell.
      #
      # Nastavte ji výslovně, když máte odkazy na jiné doméně, typicky přes
      # CNAME kvůli doručitelnosti.
      TRACKING_DOMAIN: ${TRACKING_DOMAIN:-}
      DEFAULT_LOCALE: ${DEFAULT_LOCALE:-cs}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      WORKER_HEALTH_PORT: ${WORKER_HEALTH_PORT:-3001}
      SENDER_HEALTH_PORT: ${SENDER_HEALTH_PORT:-3002}
    ports:
      - "${APP_PORT:-3000}:3000"
    volumes:
      - ./data:/data
    stop_grace_period: 40s
    read_only: true
    tmpfs:
      - /tmp:size=256m
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "/usr/local/bin/mlain", "healthcheck"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 2g

  postgres:
    image: postgres:18-alpine
    profiles: ["bundled"] # docker compose --profile bundled up -d
    restart: unless-stopped
    environment:
      POSTGRES_DB: mlain
      POSTGRES_USER: mlain_migrator
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mlain}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale-provider=icu --icu-locale=cs-CZ"
    volumes:
      # POZOR: /var/lib/postgresql, NE /var/lib/postgresql/data.
      # Oficiální image řady 18 přesunul PGDATA na /var/lib/postgresql/18/docker
      # a deklarovaný VOLUME o úroveň výš. Bind mount na starou cestu NENÍ chyba,
      # na kterou by kontejner spadl: databáze se založí do anonymního svazku,
      # všechno vypadá, že běží, a po prvním `docker compose down` jsou data pryč.
      # Je to tichá ztráta dat. Akceptační kritérium 8b.
      - ./data/postgres:/var/lib/postgresql
      - ./initdb:/docker-entrypoint-initdb.d:ro # zakládá role app a sender
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mlain_migrator -d mlain"]
      interval: 10s
      timeout: 5s
      retries: 5
    stop_grace_period: 30s
