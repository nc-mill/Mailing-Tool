name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Celkový limit workflow je 35 minut při plné paralelizaci (kapitola 3.15).
# Joby e2e a build-image běží až po zelených rychlých jobech, aby se
# neplýtvalo runnery.

jobs:
  # ---------------------------------------------------------------- 1. lint --
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      # Verze pnpm se sem NEPÍŠE. Bere se z `packageManager` v kořenovém
      # package.json, což je jediné místo, kde je uvedená.
      #
      # Dokud tu stála, CI padalo na KAŽDÉM pushi od 2. 8. 2026, a to hned
      # v tomhle kroku, tedy ještě před instalací závislostí: akce odmítne
      # běžet, když je verze zadaná dvakrát („Multiple versions of pnpm
      # specified"). Navíc si obě hodnoty odporovaly, 11.18.0 proti 10.30.1.
      # Běh trval minutu a něco, takže na první pohled vypadal jako spadlé
      # testy, přestože se k testům nikdy nedostal.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.18.1"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: oxlint
        run: pnpm exec oxlint .
      - name: eslint
        run: pnpm exec eslint .
      - name: prettier
        run: pnpm exec prettier --check .
      - name: migration-lint
        run: node tools/ci/migration-lint.mjs

  # ----------------------------------------------------------- 2. typecheck --
  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      # Verze pnpm se sem NEPÍŠE. Bere se z `packageManager` v kořenovém
      # package.json, což je jediné místo, kde je uvedená.
      #
      # Dokud tu stála, CI padalo na KAŽDÉM pushi od 2. 8. 2026, a to hned
      # v tomhle kroku, tedy ještě před instalací závislostí: akce odmítne
      # běžet, když je verze zadaná dvakrát („Multiple versions of pnpm
      # specified"). Navíc si obě hodnoty odporovaly, 11.18.0 proti 10.30.1.
      # Běh trval minutu a něco, takže na první pohled vypadal jako spadlé
      # testy, přestože se k testům nikdy nedostal.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.18.1"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run typecheck

  # ----------------------------------------------------------- 3. test-unit --
  test-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      # Verze pnpm se sem NEPÍŠE. Bere se z `packageManager` v kořenovém
      # package.json, což je jediné místo, kde je uvedená.
      #
      # Dokud tu stála, CI padalo na KAŽDÉM pushi od 2. 8. 2026, a to hned
      # v tomhle kroku, tedy ještě před instalací závislostí: akce odmítne
      # běžet, když je verze zadaná dvakrát („Multiple versions of pnpm
      # specified"). Navíc si obě hodnoty odporovaly, 11.18.0 proti 10.30.1.
      # Běh trval minutu a něco, takže na první pohled vypadal jako spadlé
      # testy, přestože se k testům nikdy nedostal.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.18.1"
          cache: pnpm
      # Klient PostgreSQL 18, protože zálohovací testy v `@mlain/core` NEJSOU
      # mockované: spouštějí skutečný `pg_dump` a `pg_restore` proti serveru
      # PostgreSQL 18, kterého si vitest nastartuje v testcontaineru
      # (`packages/core/src/test-support/pg-harness.ts`). Proto tenhle job
      # nepotřebuje `services`, ale klienta ano.
      #
      # Runner ubuntu-latest má podle svého manifestu klienta 16.14 a repozitář
      # PGDG si po instalaci ze systému zase odstraní, takže `pg_dump` z PATH
      # odmítne pracovat proti novějšímu serveru. Reprodukováno lokálně
      # s klientem 17.7 proti témuž obrazu postgres:18-alpine:
      #
      #   pg_dump: error: aborting because of server version mismatch
      #   pg_dump: detail: server version: 18.4; pg_dump version: 17.7
      #
      # Spadne při tom přesně 9 testů (backup.db 5, backup-guard.db 2,
      # backup-jobs.db 2) a 13 se přeskočí (restore.db 8, backup-verify.db 5,
      # těm padá už `beforeAll`). Je to táž devítka a třináctka, jakou hlásí CI.
      #
      # Testy se proto NEPŘESKAKUJÍ, doinstaluje se správný klient. Přeskočení
      # by znamenalo, že CI u zálohovacího nástroje neověřuje zálohu ani obnovu,
      # tedy zrovna to, co ověřit musí. Verzi 18 vyžaduje i `README.md`
      # a `mlain doctor` ji hlídá jako `backup_binary_version_mismatch`.
      - name: klient PostgreSQL 18
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc \
            | sudo tee /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc > /dev/null
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql-client-18
          # Do PATH jde adresář té konkrétní verze, ne obalovač /usr/bin/pg_dump.
          # Ten patří balíku postgresql-client-common a verzi si vybírá sám podle
          # nalezených clusterů, takže by se na stroji s předinstalovanou
          # šestnáctkou mohl trefit vedle. Explicitní cesta je jediné, co zaručí,
          # že poběží osmnáctka.
          echo "/usr/lib/postgresql/18/bin" >> "$GITHUB_PATH"
      # Samostatný krok schválně: bez něj by se neshoda verzí projevila až jako
      # devět spadlých testů uprostřed osmiminutového běhu, tedy na místě,
      # které na příčinu vůbec neukazuje.
      - name: klient je opravdu 18
        run: |
          pg_dump --version
          pg_restore --version
          pg_dump --version | grep -qE '\(PostgreSQL\) 18\.' || {
            echo "Na PATH není pg_dump 18, zálohovací testy by spadly na server version mismatch." >&2
            exit 1
          }
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run test:unit

  # ------------------------------------------------------------- 4. test-db --
  test-db:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: mlain_test
          POSTGRES_USER: mlain_migrator
          POSTGRES_PASSWORD: mlain
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U mlain_migrator -d mlain_test"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: postgres://mlain_migrator:mlain@localhost:5432/mlain_test
      DATABASE_URL_MIGRATOR: postgres://mlain_migrator:mlain@localhost:5432/mlain_test
    steps:
      - uses: actions/checkout@v4
      # Verze pnpm se sem NEPÍŠE. Bere se z `packageManager` v kořenovém
      # package.json, což je jediné místo, kde je uvedená.
      #
      # Dokud tu stála, CI padalo na KAŽDÉM pushi od 2. 8. 2026, a to hned
      # v tomhle kroku, tedy ještě před instalací závislostí: akce odmítne
      # běžet, když je verze zadaná dvakrát („Multiple versions of pnpm
      # specified"). Navíc si obě hodnoty odporovaly, 11.18.0 proti 10.30.1.
      # Běh trval minutu a něco, takže na první pohled vypadal jako spadlé
      # testy, přestože se k testům nikdy nedostal.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.18.1"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run test:db

  # ------------------------------------------------------------- 5. test-go --
  test-go:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    defaults:
      run:
        working-directory: apps/sender
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache-dependency-path: apps/sender/go.sum
      - run: go vet ./...
      - run: go test ./...

  # ------------------------------------------------- 6. test-go-integration --
  test-go-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: mlain_test
          POSTGRES_USER: mlain_migrator
          POSTGRES_PASSWORD: mlain
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U mlain_migrator -d mlain_test"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      # DATABASE_URL_MIGRATOR, ne DATABASE_URL_SENDER. testsupport.New(t) čte
      # výhradně DATABASE_URL_MIGRATOR a bez ní hlasitě spadne (t.Fatal), takže
      # tenhle job byl s DATABASE_URL_SENDER červený hned na první integrační
      # test. Je to přesně regrese R8 z plánu P09 (kapitola 31.2): sender si
      # připojení pod rolí mlain_sender ODVOZUJE sám z jediné proměnné, aby
      # testy práv a RLS neběžely omylem pod migrátorem, který RLS obchází.
      #
      # go test -tags=integration ./... běží s výchozí paralelností napříč
      # balíčky BEZ `-p 1` záměrně: harness (internal/testsupport/pg.go) dává
      # každému testu vlastní databázi klonovanou ze šablony, takže souběžné
      # balíčky si už nešlapou na sdílené schéma. Podrobnosti u bootstrapLockID.
      DATABASE_URL_MIGRATOR: postgres://mlain_migrator:mlain@localhost:5432/mlain_test
    defaults:
      run:
        working-directory: apps/sender
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache-dependency-path: apps/sender/go.sum
      - run: go test -tags=integration ./...

  # ---------------------------------------------------- 7. contracts-golden --
  # BEZ DATABÁZE, a to schválně: pouští jazykové implementace nad JSON fixtures
  # a přidání služby by mu ztrojnásobilo dobu běhu (kapitola 3.15).
  # Jediný job, který potřebuje setup obou stran naráz.
  contracts-golden:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      # Verze pnpm se sem NEPÍŠE. Bere se z `packageManager` v kořenovém
      # package.json, což je jediné místo, kde je uvedená.
      #
      # Dokud tu stála, CI padalo na KAŽDÉM pushi od 2. 8. 2026, a to hned
      # v tomhle kroku, tedy ještě před instalací závislostí: akce odmítne
      # běžet, když je verze zadaná dvakrát („Multiple versions of pnpm
      # specified"). Navíc si obě hodnoty odporovaly, 11.18.0 proti 10.30.1.
      # Běh trval minutu a něco, takže na první pohled vypadal jako spadlé
      # testy, přestože se k testům nikdy nedostal.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.18.1"
          cache: pnpm
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache-dependency-path: apps/sender/go.sum
      - run: pnpm install --frozen-lockfile
      - name: parita fixtures mezi TS a Go
        run: node tools/ci/contracts-golden.mjs

  # ------------------------------------------- 8. contracts-fixtures-schema --
  # Job jen spouští validátor, který vlastní P02: mapa skupina na schéma patří
  # ke schématům, ne sem. Proto potřebuje pnpm a nainstalované závislosti.
  contracts-fixtures-schema:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      # Verze pnpm se sem NEPÍŠE. Bere se z `packageManager` v kořenovém
      # package.json, což je jediné místo, kde je uvedená.
      #
      # Dokud tu stála, CI padalo na KAŽDÉM pushi od 2. 8. 2026, a to hned
      # v tomhle kroku, tedy ještě před instalací závislostí: akce odmítne
      # běžet, když je verze zadaná dvakrát („Multiple versions of pnpm
      # specified"). Navíc si obě hodnoty odporovaly, 11.18.0 proti 10.30.1.
      # Běh trval minutu a něco, takže na první pohled vypadal jako spadlé
      # testy, přestože se k testům nikdy nedostal.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.18.1"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node tools/ci/contracts-fixtures-schema.mjs

  # ---------------------------------------------------- 9. contracts-schema --
  # Čtvrtý bod test:parity: kontraktní sloupce existují po migracích a mají
  # očekávaný typ. Běží tady, ne v contracts-golden, protože potřebuje databázi.
  contracts-schema:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: mlain_test
          POSTGRES_USER: mlain_migrator
          POSTGRES_PASSWORD: mlain
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U mlain_migrator -d mlain_test"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL_MIGRATOR: postgres://mlain_migrator:mlain@localhost:5432/mlain_test
    steps:
      - uses: actions/checkout@v4
      # Verze pnpm se sem NEPÍŠE. Bere se z `packageManager` v kořenovém
      # package.json, což je jediné místo, kde je uvedená.
      #
      # Dokud tu stála, CI padalo na KAŽDÉM pushi od 2. 8. 2026, a to hned
      # v tomhle kroku, tedy ještě před instalací závislostí: akce odmítne
      # běžet, když je verze zadaná dvakrát („Multiple versions of pnpm
      # specified"). Navíc si obě hodnoty odporovaly, 11.18.0 proti 10.30.1.
      # Běh trval minutu a něco, takže na první pohled vypadal jako spadlé
      # testy, přestože se k testům nikdy nedostal.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.18.1"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node tools/ci/contracts-schema.mjs

  # ------------------------------------------------------- 10. openapi-drift --
  openapi-drift:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      # Verze pnpm se sem NEPÍŠE. Bere se z `packageManager` v kořenovém
      # package.json, což je jediné místo, kde je uvedená.
      #
      # Dokud tu stála, CI padalo na KAŽDÉM pushi od 2. 8. 2026, a to hned
      # v tomhle kroku, tedy ještě před instalací závislostí: akce odmítne
      # běžet, když je verze zadaná dvakrát („Multiple versions of pnpm
      # specified"). Navíc si obě hodnoty odporovaly, 11.18.0 proti 10.30.1.
      # Běh trval minutu a něco, takže na první pohled vypadal jako spadlé
      # testy, přestože se k testům nikdy nedostal.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.18.1"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Generátor se tu SCHVÁLNĚ nepouští samostatným krokem. Pouštěl se, ale
      # `pnpm contracts:generate` je turbo úloha, takže při zásahu cache
      # neproběhla a job pak porovnával dva stejně zastaralé soubory a hlásil
      # zelenou (nález I95). Dokument si teď vyrábí sama brána a rovnou ověří,
      # že soubor vznikl a je čerstvý.
      - run: node tools/ci/openapi-drift.mjs

  # ---------------------------------------------------------- 11. i18n-check --
  i18n-check:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.18.1"
      - run: node tools/ci/i18n-check.mjs

  # ------------------------------------------------------- 12. licenses-node --
  licenses-node:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      # Verze pnpm se sem NEPÍŠE. Bere se z `packageManager` v kořenovém
      # package.json, což je jediné místo, kde je uvedená.
      #
      # Dokud tu stála, CI padalo na KAŽDÉM pushi od 2. 8. 2026, a to hned
      # v tomhle kroku, tedy ještě před instalací závislostí: akce odmítne
      # běžet, když je verze zadaná dvakrát („Multiple versions of pnpm
      # specified"). Navíc si obě hodnoty odporovaly, 11.18.0 proti 10.30.1.
      # Běh trval minutu a něco, takže na první pohled vypadal jako spadlé
      # testy, přestože se k testům nikdy nedostal.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.18.1"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node tools/ci/licenses-node.mjs

  # --------------------------------------------------------- 13. licenses-go --
  licenses-go:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    defaults:
      run:
        working-directory: apps/sender
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache-dependency-path: apps/sender/go.sum
      - run: go install github.com/google/go-licenses@latest
      - name: licenční brána Go
        run: go-licenses check ./... --disallowed_types=forbidden,restricted,reciprocal

  # ----------------------------------------------------- 14. migrations-check --
  migrations-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: mlain_test
          POSTGRES_USER: mlain_migrator
          POSTGRES_PASSWORD: mlain
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U mlain_migrator -d mlain_test"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL_MIGRATOR: postgres://mlain_migrator:mlain@localhost:5432/mlain_test
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Verze pnpm se sem NEPÍŠE. Bere se z `packageManager` v kořenovém
      # package.json, což je jediné místo, kde je uvedená.
      #
      # Dokud tu stála, CI padalo na KAŽDÉM pushi od 2. 8. 2026, a to hned
      # v tomhle kroku, tedy ještě před instalací závislostí: akce odmítne
      # běžet, když je verze zadaná dvakrát („Multiple versions of pnpm
      # specified"). Navíc si obě hodnoty odporovaly, 11.18.0 proti 10.30.1.
      # Běh trval minutu a něco, takže na první pohled vypadal jako spadlé
      # testy, přestože se k testům nikdy nedostal.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.18.1"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node tools/ci/migrations-check.mjs

  # ---------------------------------------------------------- 15. build-image --
  # Kontrolu velikosti proti limitu 250 MB dělá tenhle job.
  # Samostatný job image-size NEEXISTUJE a nezavádí se (kapitola 3.15).
  build-image:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [lint, typecheck, test-unit, test-go]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: build image
        run: |
          docker build -f docker/Dockerfile \
            --build-arg IMAGE_VERSION="${GITHUB_SHA::12}" \
            -t mlain:ci .
      - name: verze binárky není prázdná (kritérium 7e)
        run: |
          VERSION="$(docker run --rm mlain:ci ml-sender --version)"
          test -n "$VERSION"
          test "$VERSION" = "${GITHUB_SHA::12}"
      - name: image běží pod uživatelem 10001 (kritérium 7)
        run: test "$(docker inspect -f '{{.Config.User}}' mlain:ci)" = "10001:10001"
      - name: devět manifestů se nezploštilo (kritérium 7d)
        run: |
          docker build -f docker/Dockerfile --target node-deps -t mlain:deps .
          for p in config contracts core db emails i18n sdk-node sdk-web ui; do
            docker run --rm mlain:deps test -f "/app/packages/$p/package.json"
          done
      - name: velikost image proti limitu 250 MB
        run: node tools/ci/image-size.mjs mlain:ci
      - name: uložit image pro job e2e
        run: docker save mlain:ci -o /tmp/mlain-ci.tar
      - uses: actions/upload-artifact@v4
        with:
          name: mlain-image
          path: /tmp/mlain-ci.tar
          retention-days: 1

  # ------------------------------------------------------------------ 16. e2e --
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [lint, typecheck, test-unit, build-image]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: mlain-image
          path: /tmp
      - run: docker load -i /tmp/mlain-ci.tar
      - run: docker tag mlain:ci ghcr.io/nc-mill/mlain:1.0.0
      # Verze pnpm se sem NEPÍŠE. Bere se z `packageManager` v kořenovém
      # package.json, což je jediné místo, kde je uvedená.
      #
      # Dokud tu stála, CI padalo na KAŽDÉM pushi od 2. 8. 2026, a to hned
      # v tomhle kroku, tedy ještě před instalací závislostí: akce odmítne
      # běžet, když je verze zadaná dvakrát („Multiple versions of pnpm
      # specified"). Navíc si obě hodnoty odporovaly, 11.18.0 proti 10.30.1.
      # Běh trval minutu a něco, takže na první pohled vypadal jako spadlé
      # testy, přestože se k testům nikdy nedostal.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.18.1"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: spustit compose
        working-directory: docker
        env:
          APP_URL: http://localhost:3000
          SECRET_KEY: "1:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA"
        run: docker compose --profile bundled up -d
      - name: čekat na readiness (kritérium 1)
        run: |
          for i in $(seq 1 60); do
            CODE="$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/api/health/ready)"
            if [ "$CODE" = "200" ]; then
              echo "ready po ${i} s"
              exit 0
            fi
            sleep 1
          done
          echo "instalace neodpověděla 200 na /api/health/ready do 60 sekund" >&2
          curl -s http://localhost:3000/api/health/ready || true
          docker compose -f docker/compose.yml logs app || true
          exit 1
      - name: graceful shutdown do 30 sekund (kritérium 6)
        working-directory: docker
        run: |
          docker compose kill -s SIGTERM app
          sleep 30
          docker compose logs app | grep -q "graceful shutdown"
      - name: Playwright zlaté cesty
        run: pnpm turbo run test:e2e
      # Log kontejneru a přehled Playwrightu se archivují VŽDY, i po zeleném
      # běhu. Pád zlaté cesty se jinak v CI vyšetřuje jen z toho, co bylo vidět
      # v prohlížeči, a příčina přitom bývá v logu aplikace. Global teardown
      # ukládá `compose-logs.txt` do `playwright-report-golden/`, takže tenhle
      # krok jen vynese, co už na disku je.
      - name: archivovat log kontejneru a přehled zlaté cesty
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-golden
          path: |
            apps/web/playwright-report-golden/
            apps/web/test-results/
          retention-days: 7
          if-no-files-found: warn

  # ------------------------------------------ 17. security-audit, NEBLOKUJÍCÍ --
  # Blokující by znamenalo, že libovolné nové CVE ve třetí straně zastaví
  # vydání i bezpečnostní opravy (kapitola 3.15).
  security-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      # Verze pnpm se sem NEPÍŠE. Bere se z `packageManager` v kořenovém
      # package.json, což je jediné místo, kde je uvedená.
      #
      # Dokud tu stála, CI padalo na KAŽDÉM pushi od 2. 8. 2026, a to hned
      # v tomhle kroku, tedy ještě před instalací závislostí: akce odmítne
      # běžet, když je verze zadaná dvakrát („Multiple versions of pnpm
      # specified"). Navíc si obě hodnoty odporovaly, 11.18.0 proti 10.30.1.
      # Běh trval minutu a něco, takže na první pohled vypadal jako spadlé
      # testy, přestože se k testům nikdy nedostal.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.18.1"
          cache: pnpm
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache-dependency-path: apps/sender/go.sum
      - run: pnpm install --frozen-lockfile
      # Přepis `postcss` v kořenovém `package.json` sem patří vysvětlením, ne
      # kódem: JSON komentář neunese a `pnpm.overrides` klíč začínající `//`
      # odmítne jako neplatný selektor.
      #
      # Next.js si postcss zamyká na PŘESNOU 8.4.31, na které jsou dva nálezy
      # stupně vysoký: čtení libovolného souboru a průchod cestou v mapě zdrojů.
      # Přes vlastní `package.json` se na to nedosáhne, závislost je Nextu
      # vnitřní, takže jediná cesta je přepis. Hlavní verze zůstává stejná,
      # rozhraní se tedy nemění. Tímtéž řádkem padá i nález v nanoidu: postcss
      # 8.5.26 si žádá `nanoid: ^3.3.17` a ten se přeloží na opravenou 3.3.18.
      #
      # Přepis `sharp` je tam ze stejného důvodu. Naše `packages/core` na 0.35.3
      # umí, ale Next.js si drží vlastní `^0.34.5` a v ní jsou čtyři CVE
      # v libvipsu. Na nás dopadají doopravdy: přes sharp jdou CIZÍ obrázky
      # stažené při extrakci značky a optimalizované přes `next/image`.
      # Že je přepis bezpečný, se dá ověřit: 0.35.0 sice ruší `failOnError`,
      # `paletteBitDepth`, `format.jp2k` a zastaralé volby `sharpen`, jenže
      # `next/dist/server/image-optimizer.js` nepoužívá ANI JEDNU z nich (volá
      # `sharp(buffer, { limitInputPixels, sequentialRead })` a `toFormat`)
      # a náš kód taky ne.
      - run: pnpm audit --audit-level=high
      - name: govulncheck
        working-directory: apps/sender
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...
